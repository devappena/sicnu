<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENA Portail RH - Redirection</title>
  <script>
    // Single Page Apps pour GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Cette solution permet de gérer le routing côté client sur GitHub Pages
    
    // Obtenir le segment de l'URL après le nom du repo
    var pathSegmentsToKeep = 1; // Changez selon votre structure (0 si à la racine, 1 si dans un sous-dossier)
    
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirection en cours...</p>
</body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ena-logo.svg" />
    <link rel="apple-touch-icon" href="/pwa-icons/icon-192x192.png" />
    <meta name="theme-color" content="#1c3d8f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portail RH - ENA</title>
    
    <!-- GitHub Pages SPA Support -->
    <script>
      // Redirection pour GitHub Pages avec React Router
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
